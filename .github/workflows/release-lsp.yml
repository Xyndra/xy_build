name: Release LSP
on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build xy-build-lsp
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: xy-build-lsp-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: xy-build-lsp-aarch64-linux
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: xy-build-lsp-x86_64-macos
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: xy-build-lsp-aarch64-macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: xy-build-lsp-x86_64-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Init grammar submodule
        run: |
          git submodule init grammar
          git submodule update grammar
      - name: Install cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p xy-build-lsp --target ${{ matrix.target }}
      - name: Rename binary
        shell: bash
        run: |
          dir="target/${{ matrix.target }}/release"
          src="$dir/xy-build-lsp"
          [ -f "$src.exe" ] && src="$src.exe"
          mv "$src" "$dir/${{ matrix.asset_name }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.asset_name }}
