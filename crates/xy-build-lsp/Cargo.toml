[package]
name = "xy-build-lsp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "xy-build-lsp"
path = "src/main.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xy-build-parser = { path = "../xy-build-parser" }
xy-build-options = { path = "../xy-build-options" }
